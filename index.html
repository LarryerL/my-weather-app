<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>温感 · 个性化天气助手</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app-container">
      <div class="top-bar">
        <div class="app-title">温感</div>
        <div class="location-badge" id="location-badge">📍 唐山市</div>
      </div>

      <div class="page active" id="home-page">
        <div class="content">
          <div class="weather-hero">
            <div class="weather-date" id="current-date">今天 · 星期四</div>
            <div class="weather-main">
              <div class="temp-display">
                <div class="temperature" id="temperature">—</div>
                <div class="weather-condition" id="weather-condition">—</div>
              </div>
              <div class="weather-icon">☀️</div>
            </div>
            <p class="subjective-text" id="subjective-text">
              正在获取唐山天气...
            </p>
            <div class="weather-stats">
              <div class="stat-item">
                <div class="stat-label">湿度</div>
                <div class="stat-value" id="humidity">—</div>
              </div>
              <div class="stat-item">
                <div class="stat-label">风速</div>
                <div class="stat-value" id="wind">—</div>
              </div>
              <div class="stat-item">
                <div class="stat-label">体感</div>
                <div class="stat-value" id="feels-like">—</div>
              </div>
            </div>
            <div class="trend-section" aria-label="温度变化趋势">
              <div class="trend-row">
                <div class="trend-label">今天 24 小时</div>
                <div class="trend-strip" id="today-trend"></div>
              </div>
              <div class="trend-row">
                <div class="trend-label">前后几天</div>
                <div class="trend-strip" id="days-trend"></div>
              </div>
            </div>
          </div>

          <div class="feedback-card">
            <div class="card-title">今日体感如何？</div>
            <div class="card-subtitle">您的反馈帮助我们更准确地理解您的温度偏好</div>
            <div class="feedback-buttons">
              <button class="feedback-btn cold" onclick="recordFeedback('cold', event)">
                <div class="icon">❄️</div>
                <div>偏冷</div>
              </button>
              <button class="feedback-btn perfect" onclick="recordFeedback('perfect', event)">
                <div class="icon">✨</div>
                <div>刚好</div>
              </button>
              <button class="feedback-btn hot" onclick="recordFeedback('hot', event)">
                <div class="icon">🔥</div>
                <div>偏热</div>
              </button>
            </div>
          </div>

          <div class="outfit-card">
            <div class="card-title">穿搭建议</div>
            <div class="warmth-indicator">
              <span>推荐厚度</span>
              <span id="suggested-warmth">3</span>
              <span>级</span>
            </div>
            <div class="outfit-grid" id="outfit-grid"></div>
          </div>
        </div>
      </div>

      <div class="page" id="wardrobe-page">
        <div class="content">
          <button class="add-item-btn" onclick="showAddModal()">➕ 添加新衣服</button>
          <div class="wardrobe-grid" id="wardrobe-grid"></div>
        </div>
      </div>

      <div class="page" id="settings-page">
        <div class="content">
          <div class="settings-section">
            <div class="settings-title">🌡️ 体感偏好</div>
            <div class="settings-desc">当前偏好：<strong id="bias-description">标准</strong></div>
            <div class="slider-container">
              <span class="slider-label">偏冷</span>
              <input
                type="range"
                min="-3"
                max="3"
                step="0.5"
                value="0"
                class="slider"
                id="temp-bias-slider"
              />
              <span class="slider-label">偏热</span>
            </div>
          </div>

          <div class="settings-section">
            <div class="settings-title">📊 使用统计</div>
            <div class="stats-grid">
              <div class="stat-box">
                <div class="stat-box-label">反馈次数</div>
                <div class="stat-box-value" id="feedback-count">0</div>
              </div>
            </div>
          </div>

          <div class="settings-section">
            <div class="settings-title">👕 衣柜统计</div>
            <div class="stats-grid">
              <div class="stat-box">
                <div class="stat-box-label">总衣服数</div>
                <div class="stat-box-value" id="total-clothes">0</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="bottom-nav">
        <div class="nav-items">
          <button class="nav-item active" onclick="switchPage('home', event)">
            <div class="nav-icon">🏠</div>
            <div class="nav-label">首页</div>
          </button>
          <button class="nav-item" onclick="switchPage('wardrobe', event)">
            <div class="nav-icon">👔</div>
            <div class="nav-label">衣柜</div>
          </button>
          <button class="nav-item" onclick="switchPage('settings', event)">
            <div class="nav-icon">⚙️</div>
            <div class="nav-label">设置</div>
          </button>
        </div>
      </div>
    </div>

    <div class="modal" id="add-modal">
      <div class="modal-content">
        <div class="modal-title">添加新衣服</div>
        <form id="add-clothes-form">
          <div class="form-group">
            <label class="form-label">上传/拍摄一张照片（必选）</label>
            <input
              type="file"
              class="form-input"
              id="clothes-image"
              accept="image/*"
            />
            <div class="image-preview-container" id="preview-container">
              <img id="image-preview" class="image-preview" />
            </div>
          </div>

          <div id="clothes-details" hidden>
            <div class="form-group">
              <label class="form-label">衣服名称（已自动识别，可修改）</label>
              <input
                type="text"
                class="form-input"
                id="clothes-name"
                placeholder="例如：白色毛衣"
                required
              />
            </div>

            <div class="form-group">
              <label class="form-label">类型</label>
              <select class="form-select" id="clothes-type" required>
                <option value="上衣">上衣</option>
                <option value="外套">外套</option>
                <option value="裤子">裤子</option>
                <option value="裙子">裙子</option>
                <option value="其他">其他</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">厚度等级（1-5，已自动识别，可修改）</label>
              <input
                type="number"
                class="form-input"
                id="clothes-warmth"
                min="1"
                max="5"
                value="3"
                required
              />
            </div>

            <div class="form-group">
              <label class="form-label">适用最低温度（°C，可微调）</label>
              <input
                type="number"
                class="form-input"
                id="clothes-min-temp"
                value="10"
                required
              />
            </div>

            <div class="form-group">
              <label class="form-label">适用最高温度（°C，可微调）</label>
              <input
                type="number"
                class="form-input"
                id="clothes-max-temp"
                value="20"
                required
              />
            </div>
          </div>

          <div class="modal-buttons">
            <button type="button" class="modal-btn modal-btn-cancel" id="btn-cancel">
              取消
            </button>
            <button type="submit" class="modal-btn modal-btn-submit">添加</button>
          </div>
        </form>
      </div>
    </div>

    <script src="./main.js"></script>
  </body>
</html>
