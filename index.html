<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>温感 · 个性化天气助手</title>
    <meta name="theme-color" content="#FAF9F6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />

    <style>
      :root {
        --bg: #faf9f6;
        --card: #ffffff;
        --ink: #1f2328;
        --muted: rgba(31, 35, 40, 0.62);
        --muted2: rgba(31, 35, 40, 0.42);
        --line: rgba(31, 35, 40, 0.08);
        --shadow: 0 12px 38px rgba(27, 24, 19, 0.06);
        --shadow2: 0 18px 58px rgba(27, 24, 19, 0.1);
        --r: 20px;

        --rose: #dba7a6;
        --rose2: #f1d7d6;
        --sage: #c7d8cf;
        --amber: #e6c48a;

        --tap: 0.985;
        --maxw: 520px;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial,
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior: none;
        overflow-x: hidden;
      }

      .app {
        max-width: var(--maxw);
        margin: 0 auto;
        min-height: 100vh;
        padding: calc(16px + env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom));
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .brand {
        font-weight: 900;
        letter-spacing: -0.4px;
        font-size: 22px;
      }

      .loc-pill {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.8);
        box-shadow: 0 10px 22px rgba(27, 24, 19, 0.04);
        color: var(--muted);
        font-weight: 800;
        font-size: 13px;
        white-space: nowrap;
      }
      .loc-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: radial-gradient(circle at 30% 30%, var(--rose2), var(--rose));
        box-shadow: 0 0 0 4px rgba(219, 167, 166, 0.16);
      }

      .page {
        display: none;
      }
      .page.active {
        display: block;
      }

      .card {
        background: var(--card);
        border-radius: var(--r);
        box-shadow: var(--shadow);
        border: 1px solid rgba(31, 35, 40, 0.06);
        padding: 18px;
      }
      .stack {
        display: grid;
        gap: 14px;
      }

      .hero {
        position: relative;
        overflow: hidden;
      }
      .hero::before {
        content: "";
        position: absolute;
        inset: -120px -140px auto auto;
        width: 240px;
        height: 240px;
        background: radial-gradient(circle at 30% 30%, rgba(219, 167, 166, 0.55), rgba(230, 196, 138, 0.18));
        filter: blur(0px);
        transform: rotate(10deg);
        pointer-events: none;
      }
      .hero::after {
        content: "";
        position: absolute;
        inset: auto auto -140px -160px;
        width: 320px;
        height: 320px;
        background: radial-gradient(circle at 30% 30%, rgba(199, 216, 207, 0.65), rgba(219, 167, 166, 0.12));
        transform: rotate(-12deg);
        pointer-events: none;
      }

      .hero-inner {
        position: relative;
        z-index: 1;
        display: grid;
        gap: 14px;
      }

      .meta-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .date {
        font-size: 13px;
        font-weight: 800;
        color: var(--muted);
      }

      .temp {
        font-size: 72px;
        font-weight: 950;
        letter-spacing: -2px;
        line-height: 1;
        margin-top: 6px;
      }
      .cond {
        margin-top: 8px;
        font-size: 16px;
        font-weight: 800;
        color: rgba(31, 35, 40, 0.86);
      }

      .mini {
        border-radius: 16px;
        border: 1px solid rgba(31, 35, 40, 0.08);
        background: rgba(255, 255, 255, 0.75);
        padding: 12px 12px;
        min-width: 92px;
        box-shadow: 0 10px 26px rgba(27, 24, 19, 0.05);
        text-align: right;
      }
      .mini .k {
        font-size: 11px;
        font-weight: 900;
        color: var(--muted2);
        letter-spacing: 0.2px;
      }
      .mini .v {
        margin-top: 4px;
        font-size: 18px;
        font-weight: 950;
      }

      .primary-text {
        margin: 0;
        padding: 14px 14px;
        border-radius: 16px;
        background: linear-gradient(135deg, rgba(219, 167, 166, 0.18), rgba(230, 196, 138, 0.14));
        border: 1px solid rgba(219, 167, 166, 0.2);
        font-size: 18px;
        font-weight: 900;
        line-height: 1.55;
        letter-spacing: -0.2px;
        white-space: pre-line;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .stat {
        padding: 12px 10px;
        border-radius: 16px;
        border: 1px solid rgba(31, 35, 40, 0.08);
        background: rgba(255, 255, 255, 0.7);
        text-align: center;
      }
      .stat .k {
        font-size: 11px;
        font-weight: 900;
        color: var(--muted2);
      }
      .stat .v {
        margin-top: 6px;
        font-size: 16px;
        font-weight: 950;
      }

      .trend {
        padding-top: 10px;
        border-top: 1px dashed rgba(31, 35, 40, 0.12);
      }
      .trend-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
      }
      .trend-row:first-child {
        margin-top: 0;
      }
      .trend-label {
        font-size: 11px;
        font-weight: 900;
        color: var(--muted);
        white-space: nowrap;
      }
      .trend-strip {
        flex: 1;
        display: flex;
        gap: 4px;
      }
      .trend-strip.isHours {
        gap: 3px;
      }
      .trend-hour {
        flex: 1;
        min-width: 0;
        height: 18px;
        border-radius: 999px;
        background: rgba(31, 35, 40, 0.06);
        position: relative;
        overflow: hidden;
      }
      .trend-hour::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(219, 167, 166, 0.72), rgba(199, 216, 207, 0.8));
        transform-origin: top;
        transform: scaleY(var(--h, 0.3));
      }
      .trend-bar {
        flex: 1;
        min-width: 0;
        border-radius: 999px;
        background: rgba(31, 35, 40, 0.06);
        position: relative;
        overflow: hidden;
      }
      .trend-bar::before {
        content: "";
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        border-radius: inherit;
        background: linear-gradient(180deg, rgba(230, 196, 138, 0.95), rgba(219, 167, 166, 0.22));
        transform-origin: bottom;
        transform: scaleY(var(--h, 0.2));
      }
      .trend-bar::after {
        content: attr(data-day);
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 10px;
        font-weight: 950;
        color: rgba(31, 35, 40, 0.78);
      }
      .trend-hours {
        margin-top: 6px;
        display: flex;
        justify-content: space-between;
        gap: 6px;
        font-size: 10px;
        font-weight: 900;
        color: rgba(31, 35, 40, 0.5);
        user-select: none;
      }

      .section-title {
        font-weight: 950;
        font-size: 15px;
        margin: 0 0 6px;
        letter-spacing: -0.2px;
      }
      .section-desc {
        margin: 0 0 14px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
        line-height: 1.45;
      }

      .feedback-buttons {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .feedback-btn {
        border: 1px solid rgba(31, 35, 40, 0.08);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(250, 249, 246, 0.9));
        border-radius: 18px;
        padding: 14px 10px;
        cursor: pointer;
        font: inherit;
        box-shadow: 0 10px 22px rgba(27, 24, 19, 0.06);
        transition: transform 120ms ease, box-shadow 180ms ease, border-color 180ms ease;
        display: grid;
        place-items: center;
        gap: 6px;
        font-weight: 950;
      }
      .feedback-btn:active {
        transform: scale(var(--tap));
      }
      .feedback-btn.cold {
        border-color: rgba(199, 216, 207, 0.7);
      }
      .feedback-btn.perfect {
        border-color: rgba(230, 196, 138, 0.55);
      }
      .feedback-btn.hot {
        border-color: rgba(219, 167, 166, 0.65);
      }
      .feedback-btn .sub {
        font-size: 11px;
        font-weight: 900;
        color: var(--muted);
      }

      .warmth-indicator {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 999px;
        border: 1px solid rgba(219, 167, 166, 0.25);
        background: linear-gradient(135deg, rgba(219, 167, 166, 0.22), rgba(230, 196, 138, 0.18));
        font-weight: 950;
      }
      #suggested-warmth {
        font-variant-numeric: tabular-nums;
      }

      .outfit-grid {
        margin-top: 12px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
        gap: 10px;
      }

      .outfit-item {
        background: rgba(250, 249, 246, 0.6);
        border: 1px solid rgba(31, 35, 40, 0.08);
        border-radius: 16px;
        padding: 12px;
        text-align: center;
        box-shadow: 0 10px 20px rgba(27, 24, 19, 0.04);
      }
      /* The first cell is the algorithm's recommendation hint card (inserted by JS). */
      .outfit-grid .outfit-item:first-child {
        background: linear-gradient(135deg, rgba(219, 167, 166, 0.17), rgba(199, 216, 207, 0.14));
        border-color: rgba(219, 167, 166, 0.25);
        box-shadow: var(--shadow2);
        text-align: left;
      }
      .outfit-item-image {
        width: 100%;
        height: 84px;
        background: rgba(31, 35, 40, 0.06);
        border-radius: 14px;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .outfit-item-name {
        font-size: 12px;
        font-weight: 950;
        color: rgba(31, 35, 40, 0.9);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .outfit-grid .outfit-item:first-child .outfit-item-name {
        white-space: normal;
        overflow: visible;
        text-overflow: clip;
        font-size: 14px;
        line-height: 1.45;
      }

      .add-item-btn {
        width: 100%;
        border: none;
        border-radius: var(--r);
        padding: 14px 16px;
        cursor: pointer;
        font: inherit;
        font-weight: 950;
        color: rgba(31, 35, 40, 0.92);
        background: linear-gradient(135deg, rgba(219, 167, 166, 0.28), rgba(230, 196, 138, 0.22));
        box-shadow: var(--shadow);
        border: 1px solid rgba(219, 167, 166, 0.24);
        transition: transform 120ms ease;
      }
      .add-item-btn:active {
        transform: scale(var(--tap));
      }

      .wardrobe-grid {
        margin-top: 12px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .wardrobe-item {
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(31, 35, 40, 0.08);
        border-radius: var(--r);
        padding: 14px;
        box-shadow: var(--shadow);
        position: relative;
        overflow: hidden;
      }
      .delete-item-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 28px;
        height: 28px;
        border-radius: 999px;
        border: 1px solid rgba(31, 35, 40, 0.1);
        background: rgba(255, 255, 255, 0.85);
        cursor: pointer;
        font-weight: 950;
        line-height: 1;
        transition: transform 120ms ease;
      }
      .delete-item-btn:active {
        transform: scale(var(--tap));
      }
      .wardrobe-item-image {
        width: 100%;
        height: 130px;
        background: rgba(31, 35, 40, 0.06);
        border-radius: 16px;
        margin-bottom: 10px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .wardrobe-item-name {
        font-size: 14px;
        font-weight: 950;
        letter-spacing: -0.2px;
      }
      .wardrobe-item-type {
        margin-top: 4px;
        font-size: 12px;
        color: var(--muted);
        font-weight: 800;
      }
      .wardrobe-item-temp {
        margin-top: 6px;
        font-size: 11px;
        color: var(--muted2);
        font-weight: 800;
      }

      .warmth-dots {
        margin-top: 10px;
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .warmth-dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: rgba(31, 35, 40, 0.12);
      }
      .warmth-dot.active {
        background: rgba(219, 167, 166, 0.95);
        box-shadow: 0 0 0 3px rgba(219, 167, 166, 0.15);
      }

      .settings-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 10px;
      }
      .slider {
        flex: 1;
        -webkit-appearance: none;
        appearance: none;
        height: 16px;
        border-radius: 999px;
        background: linear-gradient(90deg, rgba(199, 216, 207, 0.7), rgba(219, 167, 166, 0.75));
        outline: none;
        border: 1px solid rgba(31, 35, 40, 0.08);
      }
      .slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 26px;
        height: 26px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.98);
        border: 1px solid rgba(31, 35, 40, 0.12);
        box-shadow: 0 10px 24px rgba(27, 24, 19, 0.12);
      }
      .slider::-moz-range-thumb {
        width: 26px;
        height: 26px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.98);
        border: 1px solid rgba(31, 35, 40, 0.12);
        box-shadow: 0 10px 24px rgba(27, 24, 19, 0.12);
      }
      .label {
        font-size: 12px;
        font-weight: 900;
        color: var(--muted);
        white-space: nowrap;
      }

      .stats-grid {
        margin-top: 12px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .stat-box {
        border-radius: var(--r);
        border: 1px solid rgba(31, 35, 40, 0.08);
        background: rgba(255, 255, 255, 0.9);
        padding: 14px;
        text-align: center;
        box-shadow: var(--shadow);
      }
      .stat-box-label {
        font-size: 12px;
        font-weight: 900;
        color: var(--muted);
      }
      .stat-box-value {
        margin-top: 8px;
        font-size: 26px;
        font-weight: 950;
      }

      .bottom-nav {
        position: fixed;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
        width: 100%;
        max-width: var(--maxw);
        padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
        background: rgba(250, 249, 246, 0.72);
        backdrop-filter: blur(14px);
        border-top: 1px solid rgba(31, 35, 40, 0.08);
      }
      .nav-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .nav-item {
        border: 1px solid rgba(31, 35, 40, 0.08);
        background: rgba(255, 255, 255, 0.82);
        border-radius: 18px;
        padding: 10px 10px;
        cursor: pointer;
        font: inherit;
        transition: transform 120ms ease, box-shadow 200ms ease;
        display: grid;
        place-items: center;
        gap: 6px;
      }
      .nav-item:active {
        transform: scale(var(--tap));
      }
      .nav-item.active {
        box-shadow: var(--shadow2);
        border-color: rgba(219, 167, 166, 0.32);
      }
      .nav-label {
        font-size: 12px;
        font-weight: 950;
        color: rgba(31, 35, 40, 0.72);
      }
      .nav-item.active .nav-label {
        color: rgba(31, 35, 40, 0.9);
      }
      .nav-ico {
        width: 20px;
        height: 20px;
        stroke: rgba(31, 35, 40, 0.78);
        stroke-width: 2.1;
        fill: none;
      }
      .nav-item.active .nav-ico {
        stroke: rgba(219, 167, 166, 0.95);
      }

      .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(31, 35, 40, 0.28);
        backdrop-filter: blur(10px);
        z-index: 1000;
        align-items: center;
        justify-content: center;
        padding: 18px;
      }
      .modal.active {
        display: flex;
      }
      .modal-content {
        width: 100%;
        max-width: 420px;
        background: rgba(255, 255, 255, 0.98);
        border-radius: 22px;
        border: 1px solid rgba(31, 35, 40, 0.08);
        box-shadow: 0 30px 90px rgba(27, 24, 19, 0.24);
        padding: 18px;
        max-height: 85vh;
        overflow: auto;
      }
      .modal-title {
        font-size: 18px;
        font-weight: 950;
        margin: 6px 0 14px;
        letter-spacing: -0.2px;
      }
      .form-group {
        margin-bottom: 14px;
      }
      .form-label {
        display: block;
        font-size: 12px;
        font-weight: 900;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .form-input,
      .form-select {
        width: 100%;
        border-radius: 16px;
        border: 1px solid rgba(31, 35, 40, 0.12);
        background: rgba(250, 249, 246, 0.55);
        padding: 12px 12px;
        font: inherit;
        outline: none;
      }
      .form-input:focus,
      .form-select:focus {
        border-color: rgba(219, 167, 166, 0.55);
        box-shadow: 0 0 0 4px rgba(219, 167, 166, 0.16);
      }
      .image-preview-container {
        display: none;
        margin-top: 10px;
      }
      .image-preview-container.active {
        display: block;
      }
      .image-preview {
        width: 100%;
        max-height: 220px;
        object-fit: cover;
        border-radius: 16px;
        border: 1px solid rgba(31, 35, 40, 0.08);
      }
      .modal-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 16px;
      }
      .modal-btn {
        border-radius: 16px;
        border: 1px solid rgba(31, 35, 40, 0.12);
        padding: 12px 12px;
        cursor: pointer;
        font: inherit;
        font-weight: 950;
        transition: transform 120ms ease;
      }
      .modal-btn:active {
        transform: scale(var(--tap));
      }
      .modal-btn-cancel {
        background: rgba(250, 249, 246, 0.8);
        color: rgba(31, 35, 40, 0.82);
      }
      .modal-btn-submit {
        background: linear-gradient(135deg, rgba(219, 167, 166, 0.9), rgba(230, 196, 138, 0.84));
        border-color: rgba(219, 167, 166, 0.5);
        color: rgba(31, 35, 40, 0.92);
      }

      .empty-state {
        text-align: center;
        padding: 44px 12px;
        color: var(--muted);
        border-radius: 18px;
        border: 1px dashed rgba(31, 35, 40, 0.12);
        background: rgba(250, 249, 246, 0.6);
      }
      .empty-title {
        margin-top: 6px;
        font-weight: 950;
        color: rgba(31, 35, 40, 0.86);
      }
      .empty-desc {
        margin-top: 6px;
        font-weight: 700;
        font-size: 12px;
        color: var(--muted);
      }

      @media (max-width: 380px) {
        .temp {
          font-size: 64px;
        }
        .feedback-buttons {
          grid-template-columns: 1fr;
        }
        .wardrobe-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <div class="brand">温感</div>
        <div class="loc-pill" id="location-badge">
          <span class="loc-dot" aria-hidden="true"></span>
          <span>唐山市</span>
        </div>
      </div>

      <div class="page active" id="home-page">
        <div class="stack">
          <div class="card hero">
            <div class="hero-inner">
              <div class="meta-row">
                <div>
                  <div class="date" id="current-date">今天 · 星期五</div>
                  <div class="temp" id="temperature">—</div>
                  <div class="cond" id="weather-condition">—</div>
                </div>
                <div class="mini" aria-label="体感温度">
                  <div class="k">体感</div>
                  <div class="v" id="feels-like">—</div>
                </div>
              </div>

              <p class="primary-text" id="subjective-text">正在获取唐山天气...</p>

              <div class="stats" aria-label="湿度风速等信息">
                <div class="stat">
                  <div class="k">湿度</div>
                  <div class="v" id="humidity">—</div>
                </div>
                <div class="stat">
                  <div class="k">风速</div>
                  <div class="v" id="wind">—</div>
                </div>
                <div class="stat">
                  <div class="k">定位</div>
                  <div class="v">唐山</div>
                </div>
              </div>

              <label class="form-label">适用最高温度（°C，可微调）</label>

    <script>
      // Inlined from app.js (single-file delivery).
      // Keep globals minimal; expose only what inline onclick handlers need.

      (() => {
        "use strict";

        // ===== Helpers =====
        function $(sel) {
          return document.querySelector(sel);
        }

        function clamp(n, min, max) {
          return Math.max(min, Math.min(max, n));
        }

        function loadJson(key, fallback) {
          try {
            const raw = localStorage.getItem(key);
            if (!raw) return fallback;
            return JSON.parse(raw);
          } catch {
            return fallback;
          }
        }

        function saveJson(key, value) {
          localStorage.setItem(key, JSON.stringify(value));
        }

        // ===== Storage keys =====
        const STORAGE_KEYS = {
          wardrobe: "wardrobe",
          feedbackHistory: "feedbackHistory",
          userPreference: "userPreference",
          legacyTempBias: "tempBias",
        };

        // ===== User preference model (persisted) =====
        // tempOffset: calibration offset applied in perceived temp formula
        // feedbackCount: number of feedback actions by the user
        let wardrobe = loadJson(STORAGE_KEYS.wardrobe, []);
        let feedbackHistory = loadJson(STORAGE_KEYS.feedbackHistory, []);
        let userPreference = loadJson(STORAGE_KEYS.userPreference, null);

        function normalizeUserPreference() {
          if (!userPreference || typeof userPreference !== "object") {
            const legacy = Number(localStorage.getItem(STORAGE_KEYS.legacyTempBias));
            userPreference = {
              tempOffset: Number.isFinite(legacy) ? legacy : 0,
              feedbackCount: Array.isArray(feedbackHistory) ? feedbackHistory.length : 0,
            };
            persistUserPreference();
            return;
          }

          userPreference.tempOffset = Number(userPreference.tempOffset) || 0;
          userPreference.feedbackCount = Number(userPreference.feedbackCount) || 0;
        }

        function persistUserPreference() {
          saveJson(STORAGE_KEYS.userPreference, userPreference);
        }

        // Old versions used warmth 1-5; new scale is 1-10.
        function maybeMigrateWardrobeWarmthScale() {
          if (!Array.isArray(wardrobe) || wardrobe.length === 0) return;
          const hasAnyOver5 = wardrobe.some((it) => Number(it?.warmth) > 5);
          if (hasAnyOver5) return;

          const hasAny1to5 = wardrobe.some((it) => {
            const w = Number(it?.warmth);
            return Number.isFinite(w) && w >= 1 && w <= 5;
          });
          if (!hasAny1to5) return;

          wardrobe = wardrobe.map((it) => {
            const w = Number(it?.warmth);
            if (!Number.isFinite(w)) return it;
            return { ...it, warmth: clamp(Math.round(w * 2), 1, 10) };
          });
          saveJson(STORAGE_KEYS.wardrobe, wardrobe);
        }

        // ===== Weather state =====
        const QWEATHER_KEY = "63d45dfa246b4e38bcef997d971d5f4e";
        const QWEATHER_LOCATION = "101090501"; // 唐山
        const QWEATHER_NOW_ENDPOINT =
          "https://q53yfrupmn.re.qweatherapi.com/v7/weather/now";

        let currentWeather = null;

        // ===== Perceived temperature formula =====
        // calculatedPerceivedTemp = realTemp + (humidity * 0.1) - (windSpeed * 0.2) + userPreference.tempOffset
        function calculatePerceivedTemp() {
          if (!currentWeather) return null;

          const realTemp = Number(currentWeather.temp);
          const humidity = Number(currentWeather.humidity);
          const windSpeed = Number(currentWeather.windSpeed);
          const offset = Number(userPreference.tempOffset) || 0;

          if (![realTemp, humidity, windSpeed, offset].every((n) => Number.isFinite(n)))
            return null;

          return realTemp + humidity * 0.1 - windSpeed * 0.2 + offset;
        }

        function buildSubjectiveLine(perceivedTemp) {
          if (perceivedTemp <= 0) return "今天体感很冷，建议最里面保暖打底，再叠加厚外套。";
          if (perceivedTemp <= 8) return "今天体感偏冷，建议毛衣+外套，注意脖子和脚部保暖。";
          if (perceivedTemp <= 15) return "今天体感偏凉，长袖打底配薄外套会比较舒服。";
          if (perceivedTemp <= 22) return "今天体感刚刚好，薄长袖或短袖+轻薄外搭就很合适。";
          if (perceivedTemp <= 28) return "今天体感偏暖，轻薄短袖为主，出汗多可以选更透气的面料。";
          return "今天体感偏热，尽量选择宽松、透气、浅色的衣服，多补水。";
        }

        // ===== Outfit engine: perceived temp -> warmth level (1-10) and labels =====
        function getOutfitPlan(perceivedTemp) {
          // From warm to cold.
          const buckets = [
            { min: 28, warmth: 1, label: "清凉透气", pieces: ["短袖/背心", "短裤/薄裤"] },
            { min: 26, warmth: 2, label: "轻薄通勤", pieces: ["短袖", "薄衬衫/防晒衫"] },
            { min: 24, warmth: 3, label: "微风可加", pieces: ["短袖/薄衬衫", "轻薄外搭"] },
            { min: 22, warmth: 4, label: "舒适过渡", pieces: ["长袖打底", "薄外套"] },
            // 20-22C: thin knit (example requested)
            { min: 20, warmth: 5, label: "薄针织", pieces: ["薄针织/长袖T", "轻便长裤"] },
            // 18-20C: trench coat (example requested)
            { min: 18, warmth: 6, label: "风衣", pieces: ["风衣/夹克", "长袖打底"] },
            { min: 16, warmth: 7, label: "卫衣外套", pieces: ["卫衣", "外套"] },
            { min: 14, warmth: 8, label: "毛衣外套", pieces: ["毛衣", "中等外套"] },
            { min: 10, warmth: 9, label: "保暖加强", pieces: ["加绒/叠穿", "厚外套"] },
            { min: -999, warmth: 10, label: "重度保暖", pieces: ["羽绒/棉服", "保暖内衣"] },
          ];

          return buckets.find((b) => perceivedTemp >= b.min) || buckets[buckets.length - 1];
        }

        // ===== Date =====
        function updateDate() {
          const days = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
          const now = new Date();
          const dayName = days[now.getDay()];
          const el = $("#current-date");
          if (el) el.textContent = `今天 · ${dayName}`;
        }

        // ===== Weather UI =====
        function updateWeatherDisplay() {
          const tempEl = $("#temperature");
          const condEl = $("#weather-condition");
          const humEl = $("#humidity");
          const windEl = $("#wind");
          const feelsEl = $("#feels-like");
          const subjEl = $("#subjective-text");

          if (!tempEl || !condEl || !humEl || !windEl || !feelsEl) return;

          if (!currentWeather) {
            tempEl.textContent = "—";
            condEl.textContent = "—";
            humEl.textContent = "—";
            windEl.textContent = "—";
            feelsEl.textContent = "—";
            if (subjEl) subjEl.textContent = "正在获取唐山天气...";
            return;
          }

          const perceived = calculatePerceivedTemp();

          tempEl.textContent = `${Number(currentWeather.temp)}°`;
          condEl.textContent = currentWeather.condition || "—";
          humEl.textContent = `${Number(currentWeather.humidity)}%`;
          windEl.textContent = `${Number(currentWeather.windSpeed)} km/h`;
          feelsEl.textContent = perceived == null ? "—" : `${perceived.toFixed(1)}°`;
          if (subjEl)
            subjEl.textContent = perceived == null ? "正在计算体感..." : buildSubjectiveLine(perceived);
        }

        // ===== Trends =====
        function renderTrends(perceivedTemp) {
          const todayStrip = $("#today-trend");
          const daysStrip = $("#days-trend");
          if (!todayStrip || !daysStrip) return;

          const hours = Array.from({ length: 24 }, (_, i) => {
            const x = (i - 12) / 12;
            const wave = Math.sin(x * Math.PI) * 3.2;
            return Math.round((perceivedTemp + wave) * 10) / 10;
          });
          renderHourBars(todayStrip, hours);

          const days = [-1, 0, 1, 2, 3].map((d) => ({
            label: d === 0 ? "今" : d === -1 ? "昨" : `+${d}`,
            temp: Math.round((perceivedTemp + d * 1.2) * 10) / 10,
          }));
          renderDayBars(daysStrip, days);
        }

        function renderHourBars(container, temps) {
          container.classList.add("isHours");
          const min = Math.min(...temps);
          const max = Math.max(...temps);
          const span = Math.max(3, max - min || 1);

          container.innerHTML = temps
            .map((t) => {
              const h = 0.18 + ((t - min) / span) * 0.75;
              return `<div class="trend-hour" style="--h:${h.toFixed(2)}"></div>`;
            })
            .join("");

          const hoursEl = document.getElementById("today-hours");
          if (hoursEl) {
            const ticks = [0, 3, 6, 9, 12, 15, 18, 21];
            hoursEl.innerHTML = ticks.map((h) => `<span>${h}</span>`).join("");
          }
        }

        function renderDayBars(container, days) {
          const temps = days.map((d) => d.temp);
          const min = Math.min(...temps);
          const max = Math.max(...temps);
          const span = Math.max(3, max - min || 1);

          container.innerHTML = days
            .map((d) => {
              const h = 0.25 + ((d.temp - min) / span) * 0.65;
              return `<div class="trend-bar" style="--h:${h.toFixed(2)}" data-day="${d.label}"></div>`;
            })
            .join("");
        }

        // ===== Recommendation update (single entry point) =====
        function updateRecommendation() {
          updateWeatherDisplay();

          const container = $("#outfit-grid");
          if (!container) return;

          if (!currentWeather) {
            container.innerHTML = "";
            return;
          }

          const perceived = calculatePerceivedTemp();
          if (perceived == null) {
            container.innerHTML = "";
            return;
          }

          const plan = getOutfitPlan(perceived);
          const warmthEl = $("#suggested-warmth");
          if (warmthEl) warmthEl.textContent = String(plan.warmth);

          // Show the recommendation in the most prominent text area on Home.
          // This is derived from the same outfit engine output.
          const subjEl = $("#subjective-text");
          if (subjEl) {
            subjEl.textContent = `建议：${plan.label}（厚度 ${plan.warmth} 级）\n${plan.pieces.join(" · ")}`;
          }

          const suitableClothes = (Array.isArray(wardrobe) ? wardrobe : [])
            .filter((item) => {
              const w = Number(item?.warmth);
              const minT = Number(item?.minTemp);
              const maxT = Number(item?.maxTemp);
              if (![w, minT, maxT].every((n) => Number.isFinite(n))) return false;
              const warmthOk = Math.abs(w - plan.warmth) <= 1;
              const tempOk = perceived >= minT && perceived <= maxT;
              return warmthOk && tempOk;
            })
            .sort(
              (a, b) =>
                Math.abs(Number(a.warmth) - plan.warmth) -
                Math.abs(Number(b.warmth) - plan.warmth),
            );

          const hintCard = `
      <div class="outfit-item" style="grid-column:1/-1;">
        <div class="outfit-item-name" style="white-space:normal;line-height:1.35;">
          建议：${plan.label}（厚度 ${plan.warmth} 级）<br />
          <span style="font-weight:700;color:rgba(99,110,114,0.9);">${plan.pieces.join(" · ")}</span>
        </div>
      </div>
    `;

          if (!suitableClothes.length) {
            container.innerHTML =
              hintCard +
              `
        <div class="empty-state" style="grid-column:1/-1;">
          <div class="empty-title">暂无合适衣服</div>
          <div class="empty-desc">快去衣柜添加吧！</div>
        </div>
      `;
          } else {
            container.innerHTML =
              hintCard +
              suitableClothes
                .map(
                  (item) => `
          <div class="outfit-item">
            <div class="outfit-item-image">
              ${
                item.image
                  ? `<img src="${item.image}" style="width:100%;height:100%;object-fit:cover;border-radius:12px;">`
                  : ""
              }
            </div>
            <div class="outfit-item-name">${item.name}</div>
          </div>
        `,
                )
                .join("");
          }

          renderTrends(perceived);
        }

        // ===== Feedback loop =====
        const OFFSET_MIN = -6;
        const OFFSET_MAX = 6;
        const OFFSET_STEP = 0.5;

        // Note: Because the formula uses "+ tempOffset", to make "偏冷 => 更厚" work,
        // we adjust tempOffset downwards on "cold" (lower perceived temp => thicker recommendation).
        function applyFeedbackToOffset(feeling) {
          if (feeling === "cold") userPreference.tempOffset -= OFFSET_STEP;
          else if (feeling === "hot") userPreference.tempOffset += OFFSET_STEP;
          userPreference.tempOffset = clamp(userPreference.tempOffset, OFFSET_MIN, OFFSET_MAX);
        }

        function recordFeedback(feeling, evt) {
          userPreference.feedbackCount += 1;
          applyFeedbackToOffset(feeling);
          persistUserPreference();

          const perceived = calculatePerceivedTemp();
          const entry = {
            date: new Date().toISOString(),
            realTemp: currentWeather?.temp,
            humidity: currentWeather?.humidity,
            windSpeed: currentWeather?.windSpeed,
            perceivedTemp: perceived,
            feeling,
            tempOffset: userPreference.tempOffset,
          };

          feedbackHistory = Array.isArray(feedbackHistory) ? feedbackHistory : [];
          feedbackHistory.push(entry);
          saveJson(STORAGE_KEYS.feedbackHistory, feedbackHistory);

          const btn = evt?.target?.closest(".feedback-btn");
          if (btn) btn.style.transform = "scale(0.95)";

          // Immediate UI refresh so user can feel the feedback loop right away.
          updateRecommendation();
          updateSettings();

          setTimeout(() => {
            if (btn) btn.style.transform = "";
            askWhatWorn();
          }, 80);
        }

        function askWhatWorn() {
          const ok = confirm("今天大概穿了什么？如果方便，我可以用语音帮你记下来。");
          if (!ok) return;

          const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (!SpeechRecognition) {
            alert("当前浏览器不支持语音输入，可以先记在心里，下次再试。");
            return;
          }

          const recognition = new SpeechRecognition();
          recognition.lang = "zh-CN";
          recognition.interimResults = false;
          recognition.maxAlternatives = 1;

          recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            if (!transcript) return;
            const last = feedbackHistory?.[feedbackHistory.length - 1];
            if (last) {
              last.outfitSpoken = transcript;
              saveJson(STORAGE_KEYS.feedbackHistory, feedbackHistory);
            }
            alert(`已记下今天的穿搭：${transcript}`);
          };

          recognition.onerror = () => {
            alert("语音识别没有成功，可以稍后再试一次。");
          };

          recognition.start();
        }

        // ===== Page switch =====
        function switchPage(pageName, evt) {
          document.querySelectorAll(".page").forEach((p) => {
            p.style.display = "none";
            p.classList.remove("active");
          });
          document.querySelectorAll(".nav-item").forEach((n) => n.classList.remove("active"));

          const pageEl = document.getElementById(`${pageName}-page`);
          if (pageEl) {
            pageEl.style.display = "block";
            pageEl.classList.add("active");
          }

          const nav = evt?.currentTarget || evt?.target?.closest(".nav-item");
          if (nav) nav.classList.add("active");

          if (pageName === "wardrobe") renderWardrobe();
          if (pageName === "settings") updateSettings();

          if (window.lucide?.createIcons) window.lucide.createIcons();
        }

        // ===== Wardrobe / modal =====
        function showAddModal() {
          const modal = $("#add-modal");
          if (modal) modal.classList.add("active");
        }

        function closeAddModal() {
          const modal = $("#add-modal");
          const form = $("#add-clothes-form");
          const preview = $("#preview-container");
          const details = $("#clothes-details");

          if (modal) modal.classList.remove("active");
          if (form) form.reset();
          if (preview) preview.classList.remove("active");
          if (details) details.hidden = true;
        }

        function previewImage(event) {
          const file = event.target.files?.[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = (e) => {
            const img = $("#image-preview");
            const container = $("#preview-container");
            if (!img || !container) return;

            img.src = e.target?.result;
            container.classList.add("active");

            const details = $("#clothes-details");
            if (details) details.hidden = false;

            autoFillClothesFromImage();
          };

          reader.readAsDataURL(file);
        }

        function autoFillClothesFromImage() {
          const nameInput = $("#clothes-name");
          const typeInput = $("#clothes-type");
          const warmthInput = $("#clothes-warmth");
          const minInput = $("#clothes-min-temp");
          const maxInput = $("#clothes-max-temp");
          if (!nameInput || !typeInput || !warmthInput || !minInput || !maxInput) return;

          const perceived = calculatePerceivedTemp() ?? Number(currentWeather?.temp ?? 18);
          const plan = getOutfitPlan(perceived);

          const warmth = plan.warmth;
          const baseName =
            warmth >= 9
              ? "厚外套 / 羽绒"
              : warmth >= 7
                ? "毛衣 / 外套"
                : warmth >= 5
                  ? "风衣 / 薄外套"
                  : warmth >= 3
                    ? "薄外搭"
                    : "短袖 / 薄衫";

          if (!nameInput.value.trim()) nameInput.value = baseName;
          if (!typeInput.value) typeInput.value = warmth >= 6 ? "外套" : "上衣";
          warmthInput.value = String(warmth);

          const span = 6;
          const min = Math.round((perceived - span - 2) * 1) / 1;
          const max = Math.round((perceived + span + 2) * 1) / 1;
          minInput.value = String(min);
          maxInput.value = String(max);
        }

        function addClothes(event) {
          event.preventDefault();

          const name = $("#clothes-name")?.value.trim();
          const type = $("#clothes-type")?.value;
          const warmth = Number($("#clothes-warmth")?.value);
          const minTemp = Number($("#clothes-min-temp")?.value);
          const maxTemp = Number($("#clothes-max-temp")?.value);
          const imageFile = $("#clothes-image")?.files?.[0];

          if (!imageFile) {
            alert("请先拍一张/选一张照片再添加。");
            return;
          }
          if (!name) {
            alert("请输入衣服名称");
            return;
          }
          if (![warmth, minTemp, maxTemp].every((n) => Number.isFinite(n))) {
            alert("请检查厚度/温度范围输入是否正确。");
            return;
          }

          const newItem = {
            id: Date.now(),
            name,
            type,
            warmth: clamp(Math.round(warmth), 1, 10),
            minTemp,
            maxTemp,
            image: null,
          };

          const reader = new FileReader();
          reader.onload = (e) => {
            newItem.image = e.target?.result;
            wardrobe = Array.isArray(wardrobe) ? wardrobe : [];
            wardrobe.push(newItem);
            saveJson(STORAGE_KEYS.wardrobe, wardrobe);
            renderWardrobe();
            updateRecommendation();
            closeAddModal();
          };
          reader.readAsDataURL(imageFile);
        }

        function deleteClothes(id) {
          if (!confirm("确定要删除这件衣服吗？")) return;
          wardrobe = (Array.isArray(wardrobe) ? wardrobe : []).filter((item) => item.id !== id);
          saveJson(STORAGE_KEYS.wardrobe, wardrobe);
          renderWardrobe();
          updateRecommendation();
        }

        function renderWardrobe() {
          const container = $("#wardrobe-grid");
          if (!container) return;

          if (!Array.isArray(wardrobe) || wardrobe.length === 0) {
            container.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1;">
          <div class="empty-title">衣柜空空如也</div>
          <div class="empty-desc">点击上方按钮添加您的第一件衣服</div>
        </div>
      `;
            return;
          }

          container.innerHTML = wardrobe
            .map(
              (item) => `
        <div class="wardrobe-item">
          <button class="delete-item-btn" onclick="deleteClothes(${item.id})">×</button>
          <div class="wardrobe-item-image">
            ${
              item.image
                ? `<img src="${item.image}" style="width:100%;height:100%;object-fit:cover;border-radius:16px;">`
                : ""
            }
          </div>
          <div class="wardrobe-item-name">${item.name}</div>
          <div class="wardrobe-item-type">${item.type}</div>
          <div class="wardrobe-item-temp">${item.minTemp}°C - ${item.maxTemp}°C</div>
          <div class="warmth-dots">
            ${Array.from({ length: 10 }, (_, idx) => idx + 1)
              .map((i) => `<div class="warmth-dot ${i <= Number(item.warmth) ? "active" : ""}"></div>`)
              .join("")}
          </div>
        </div>
      `,
            )
            .join("");
        }

        // ===== Settings =====
        function updateBiasDescription() {
          const offset = Number(userPreference.tempOffset) || 0;
          let desc = "标准";
          if (offset <= -4.5) desc = "非常怕冷";
          else if (offset <= -2.5) desc = "比较怕冷";
          else if (offset <= -0.5) desc = "略怕冷";
          else if (offset >= 4.5) desc = "非常怕热";
          else if (offset >= 2.5) desc = "比较怕热";
          else if (offset >= 0.5) desc = "略怕热";

          const el = $("#bias-description");
          if (el) el.textContent = desc;
        }

        function updateSettings() {
          const feedbackCountEl = $("#feedback-count");
          const totalClothesEl = $("#total-clothes");
          const slider = $("#temp-bias-slider");

          if (feedbackCountEl)
            feedbackCountEl.textContent = String(userPreference.feedbackCount || 0);
          if (totalClothesEl)
            totalClothesEl.textContent = String(Array.isArray(wardrobe) ? wardrobe.length : 0);
          if (slider) slider.value = String(Number(userPreference.tempOffset) || 0);
          updateBiasDescription();
        }

        // ===== Events =====
        function bindEvents() {
          const slider = $("#temp-bias-slider");
          if (slider) {
            slider.addEventListener("input", (e) => {
              userPreference.tempOffset = Number(e.target.value) || 0;
              userPreference.tempOffset = clamp(userPreference.tempOffset, OFFSET_MIN, OFFSET_MAX);
              persistUserPreference();
              updateSettings();
              updateRecommendation();
            });
          }

          const modal = $("#add-modal");
          if (modal) {
            modal.addEventListener("click", (e) => {
              if (e.target === modal) closeAddModal();
            });
          }

          const form = $("#add-clothes-form");
          if (form) form.addEventListener("submit", addClothes);

          const cancelBtn = $("#btn-cancel");
          if (cancelBtn) cancelBtn.addEventListener("click", closeAddModal);

          const fileInput = $("#clothes-image");
          if (fileInput) fileInput.addEventListener("change", previewImage);
        }

        // ===== Real weather fetch =====
        async function getRealWeather() {
          const url = `${QWEATHER_NOW_ENDPOINT}?location=${QWEATHER_LOCATION}&key=${QWEATHER_KEY}`;
          const res = await fetch(url);
          const data = await res.json();
          console.log("API 返回数据：", data);

          if (!res.ok || data?.code !== "200" || !data?.now) {
            throw new Error(`qweather now failed: ${data?.code || res.status}`);
          }

          const now = data.now;
          currentWeather = {
            temp: Number(now.temp),
            humidity: Number(now.humidity),
            windSpeed: Number(now.windSpeed),
            condition: now.text,
          };

          console.log("唐山天气已连接，当前温度：" + data.now.temp);
        }

        // ===== Init =====
        function init() {
          normalizeUserPreference();
          maybeMigrateWardrobeWarmthScale();

          bindEvents();
          updateDate();
          renderWardrobe();
          updateSettings();
          updateRecommendation();

          if (window.lucide?.createIcons) window.lucide.createIcons();

          return getRealWeather()
            .catch((err) => {
              console.error(err);
              // Keep the app usable even when the API fails (CORS, network, quota, etc.).
              if (!currentWeather) {
                currentWeather = {
                  temp: 18,
                  humidity: 65,
                  windSpeed: 12,
                  condition: "—",
                };
              }
              const subjEl = $("#subjective-text");
              if (subjEl) subjEl.textContent = "天气获取失败，已使用本地模拟天气用于展示。";
            })
            .finally(() => {
              updateRecommendation();
            });
        }

        // Expose to inline onclick
        window.recordFeedback = recordFeedback;
        window.switchPage = switchPage;
        window.showAddModal = showAddModal;
        window.deleteClothes = deleteClothes;

        window.addEventListener("load", () => {
          document.querySelectorAll(".page").forEach((p) => (p.style.display = "none"));
          const home = document.getElementById("home-page");
          if (home) home.style.display = "block";
          init();
        });
      })();
    </script>
  </body>
</html>
