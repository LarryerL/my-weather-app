<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>温感 · 体感天气助手</title>
    <meta name="theme-color" content="#FAF9F6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #faf9f6;
        --card: #ffffff;
        --ink: #5a5a5a;
        --muted: rgba(95, 95, 95, 0.72);
        --muted2: rgba(95, 95, 95, 0.52);
        --line: rgba(95, 95, 95, 0.14);
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
        --r: 24px;
        --maxw: 560px;

        --coral: #ff9f89;
        --coral-2: #ffd2c8;
        --gold: #ffe7b3;
        --bluegray: #c8d5e6;
        --bluegray-2: #eef3fb;
        --cream: #f7f1e1;

        --trend: rgba(255, 159, 137, 0.55);

        /* Diffuse mesh palette (overridden by body[data-sky]) */
        --mesh-1: rgba(255, 231, 179, 0.46);
        --mesh-2: rgba(255, 159, 137, 0.35);
        --mesh-3: rgba(255, 255, 255, 0.75);
        --mesh-4: rgba(247, 241, 225, 0.85);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Quicksand", ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica,
          Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior: none;
        overflow-x: hidden;
      }

      .bg {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background: radial-gradient(circle at 20% 15%, var(--mesh-1), rgba(250, 249, 246, 0) 58%),
          radial-gradient(circle at 78% 18%, var(--mesh-2), rgba(250, 249, 246, 0) 58%),
          radial-gradient(circle at 18% 80%, var(--mesh-4), rgba(250, 249, 246, 0) 62%),
          radial-gradient(circle at 82% 78%, rgba(90, 90, 90, 0.05), rgba(250, 249, 246, 0) 62%);
        animation: diffuse 14s ease-in-out infinite;
      }

      @keyframes diffuse {
        0% {
          filter: saturate(1) contrast(1);
          transform: translate3d(0, 0, 0) scale(1);
        }
        50% {
          filter: saturate(1.05) contrast(1.02);
          transform: translate3d(0, -1.2%, 0) scale(1.02);
        }
        100% {
          filter: saturate(1) contrast(1);
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      body[data-sky="rain"] {
        --mesh-1: rgba(200, 213, 230, 0.55);
        --mesh-2: rgba(238, 243, 251, 0.82);
        --mesh-4: rgba(200, 213, 230, 0.3);
      }
      body[data-sky="sun"] {
        --mesh-1: rgba(255, 231, 179, 0.56);
        --mesh-2: rgba(255, 159, 137, 0.35);
        --mesh-4: rgba(247, 241, 225, 0.9);
      }
      body[data-sky="cloud"] {
        --mesh-1: rgba(255, 255, 255, 0.72);
        --mesh-2: rgba(200, 213, 230, 0.34);
        --mesh-4: rgba(247, 241, 225, 0.82);
      }
      body[data-sky="wind"] {
        --mesh-1: rgba(247, 241, 225, 0.85);
        --mesh-2: rgba(200, 213, 230, 0.25);
        --mesh-4: rgba(255, 231, 179, 0.28);
      }
      body[data-sky="snow"] {
        --mesh-1: rgba(255, 255, 255, 0.82);
        --mesh-2: rgba(200, 213, 230, 0.36);
        --mesh-4: rgba(238, 243, 251, 0.82);
      }

      .app {
        max-width: var(--maxw);
        margin: 0 auto;
        min-height: 100vh;
        padding: calc(88px + env(safe-area-inset-top)) 28px
          calc(86px + env(safe-area-inset-bottom));
      }

      .topbar {
        position: fixed;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        max-width: var(--maxw);
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: calc(14px + env(safe-area-inset-top)) 28px 14px;
        margin-bottom: 0;
        background: rgba(255, 255, 255, 0.62);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid rgba(90, 90, 90, 0.1);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.03);
      }
      .brand {
        font-weight: 800;
        letter-spacing: -0.2px;
        font-size: 18px;
      }
      .loc {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.86);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
        white-space: nowrap;
      }
      .loc-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: radial-gradient(circle at 30% 30%, var(--gold), var(--coral));
        box-shadow: 0 0 0 4px rgba(255, 159, 137, 0.16);
      }

      .tab {
        display: none;
      }
      .tab.active {
        display: block;
      }
      .stack {
        display: grid;
        gap: 24px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--r);
        box-shadow: var(--shadow);
        padding: 24px;
      }
      .card-lite {
        border-radius: var(--r);
        background: rgba(250, 249, 246, 0.62);
        border: 1px solid rgba(95, 95, 95, 0.14);
        box-shadow: var(--shadow);
        padding: 24px;
      }
      .h2 {
        font-weight: 800;
        font-size: 16px;
        margin: 0;
      }
      .p {
        margin: 10px 0 0;
        color: var(--muted);
        font-weight: 700;
        line-height: 1.55;
      }

      .hero {
        position: relative;
        overflow: hidden;
      }
      .hero-mesh {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: radial-gradient(circle at 20% 20%, var(--mesh-1), rgba(250, 249, 246, 0) 58%),
          radial-gradient(circle at 82% 16%, var(--mesh-2), rgba(250, 249, 246, 0) 58%),
          radial-gradient(circle at 28% 82%, var(--mesh-4), rgba(250, 249, 246, 0) 62%);
        opacity: 0.95;
        transition: filter 500ms ease;
      }
      .hero-content {
        position: relative;
        z-index: 1;
      }

      .temp-block {
        display: grid;
        gap: 10px;
      }
      .temp-now {
        font-size: 82px;
        font-weight: 800;
        letter-spacing: -1.6px;
        line-height: 0.95;
      }
      .temp-sub {
        font-size: 13px;
        font-weight: 800;
        color: var(--muted);
      }
      .temp-sub-num {
        font-weight: 800;
        color: var(--ink);
      }
      .cond {
        margin-top: 0;
        font-size: 12px;
        font-weight: 800;
        color: rgba(95, 95, 95, 0.78);
      }

      .insight {
        margin-top: 16px;
        padding: 18px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(255, 159, 137, 0.18);
        color: rgba(95, 95, 95, 0.92);
        font-weight: 700;
        line-height: 1.6;
        white-space: pre-line;
      }

      .trend {
        margin-top: 16px;
      }
      .trend-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }
      .trend-title {
        font-size: 12px;
        font-weight: 800;
        color: var(--muted);
      }
      .trend-note {
        font-size: 12px;
        font-weight: 800;
        color: rgba(95, 95, 95, 0.82);
      }
      #trend-canvas {
        width: 100%;
        height: 120px;
        display: block;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.62);
        border: 1px solid rgba(95, 95, 95, 0.14);
      }

      .outfit {
        margin-top: 14px;
      }
      .outfit-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 8px;
      }
      .outfit-title {
        font-size: 12px;
        font-weight: 800;
        color: var(--muted);
      }
      .outfit-lv {
        padding: 8px 10px;
        border-radius: 999px;
        background: rgba(255, 159, 137, 0.12);
        border: 1px solid rgba(255, 159, 137, 0.22);
        font-weight: 800;
        color: rgba(95, 95, 95, 0.92);
        white-space: nowrap;
      }
      .outfit-items {
        font-weight: 700;
        color: rgba(95, 95, 95, 0.9);
        line-height: 1.55;
      }

      .quick-feedback {
        margin-top: 16px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .qbtn {
        border: 1px solid rgba(95, 95, 95, 0.14);
        background: var(--cream);
        border-radius: 999px;
        padding: 12px 12px;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        box-shadow: var(--shadow);
        transition: transform 220ms cubic-bezier(0.2, 0.9, 0.2, 1);
      }
      .qbtn:active {
        transform: scale(1.02);
      }
      .qbtn.cold {
        background: linear-gradient(135deg, rgba(185, 215, 255, 0.55), rgba(247, 241, 225, 0.92));
      }
      .qbtn.ok {
        background: var(--cream);
      }
      .qbtn.hot {
        background: linear-gradient(135deg, rgba(255, 159, 137, 0.32), rgba(247, 241, 225, 0.92));
      }

      .stat-row {
        margin-top: 14px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .stat {
        border-radius: 18px;
        background: rgba(250, 249, 246, 0.62);
        border: 1px solid rgba(95, 95, 95, 0.14);
        box-shadow: var(--shadow);
        padding: 14px 14px;
        text-align: center;
      }
      .stat .k {
        font-size: 12px;
        font-weight: 800;
        color: var(--muted);
      }
      .stat .v {
        margin-top: 8px;
        font-size: 22px;
        font-weight: 800;
        color: rgba(95, 95, 95, 0.92);
      }

      .slider-block {
        margin-top: 14px;
        border-radius: 18px;
        background: rgba(250, 249, 246, 0.62);
        border: 1px solid rgba(95, 95, 95, 0.14);
        box-shadow: var(--shadow);
        padding: 14px;
      }
      .slider-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }
      .slider-head .k {
        font-weight: 800;
        color: var(--muted);
      }
      .slider-head .v {
        font-weight: 800;
        color: rgba(95, 95, 95, 0.92);
      }
      .slider {
        width: 100%;
        -webkit-appearance: none;
        appearance: none;
        height: 16px;
        border-radius: 999px;
        background: linear-gradient(90deg, rgba(185, 215, 255, 0.85), rgba(255, 159, 137, 0.85));
        outline: none;
        border: 1px solid rgba(95, 95, 95, 0.14);
      }
      .slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.98);
        border: 1px solid rgba(95, 95, 95, 0.18);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.04);
      }
      .slider::-moz-range-thumb {
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.98);
        border: 1px solid rgba(95, 95, 95, 0.18);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.04);
      }
      .slider-ends {
        margin-top: 8px;
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        font-weight: 800;
        color: rgba(95, 95, 95, 0.6);
      }

      .tabbar {
        position: fixed;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
        width: 100%;
        max-width: var(--maxw);
        height: calc(60px + env(safe-area-inset-bottom));
        padding: 8px 18px calc(8px + env(safe-area-inset-bottom));
        background: rgba(250, 249, 246, 0.78);
        backdrop-filter: blur(14px);
        border-top: 1px solid rgba(95, 95, 95, 0.14);
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .tabbtn {
        border: 1px solid rgba(95, 95, 95, 0.14);
        background: rgba(255, 255, 255, 0.88);
        border-radius: 18px;
        padding: 0;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        color: rgba(95, 95, 95, 0.86);
        box-shadow: var(--shadow);
        transition: transform 160ms ease, box-shadow 200ms ease, border-color 200ms ease;
        display: grid;
        place-items: center;
      }
      .tabbtn:active {
        transform: scale(0.985);
      }
      .tabbtn.active {
        border-color: rgba(255, 159, 137, 0.32);
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.03);
        color: rgba(95, 95, 95, 0.92);
      }

      .tabico {
        width: 22px;
        height: 22px;
        stroke: rgba(90, 90, 90, 0.82);
        stroke-width: 2.1;
        fill: none;
      }
      .tabbtn.active .tabico {
        stroke: rgba(255, 159, 137, 0.95);
      }

      /* Loading skeleton */
      .skeleton {
        border-radius: 999px;
        background: linear-gradient(
          90deg,
          rgba(95, 95, 95, 0.08),
          rgba(95, 95, 95, 0.06),
          rgba(95, 95, 95, 0.08)
        );
        background-size: 180% 100%;
        animation: sk 1.2s ease-in-out infinite;
      }
      .sk-line {
        height: 12px;
        margin-top: 10px;
      }
      .sk-line:first-child {
        margin-top: 0;
      }
      .w60 {
        width: 60%;
      }
      .w80 {
        width: 80%;
      }
      .w95 {
        width: 95%;
      }
      @keyframes sk {
        0% {
          background-position: 0% 50%;
        }
        100% {
          background-position: 180% 50%;
        }
      }

      @media (max-width: 390px) {
        .temp-now {
          font-size: 68px;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>

    <main class="app" aria-label="温感">
      <header class="topbar">
        <div class="brand">温感</div>
        <div class="loc" id="loc-pill">
          <span class="loc-dot" aria-hidden="true"></span>
          <span id="loc-name">唐山市</span>
        </div>
      </header>

      <section class="tab active" id="tab-home" aria-label="首页">
        <div class="stack">
          <section class="hero card" id="home-hero" aria-label="实时体感">
            <div class="hero-mesh" aria-hidden="true"></div>
            <div class="hero-content">
              <div class="temp-block" aria-label="温度">
                <div class="temp-now" id="ui-temp-now">—</div>
                <div class="temp-sub">
                  体感温度 <span class="temp-sub-num" id="ui-temp-perceived">—</span>
                </div>
                <div class="cond" id="ui-cond">—</div>
              </div>

              <div class="insight" id="ui-insight" aria-label="智能洞察">
                <div class="skeleton sk-line w80"></div>
                <div class="skeleton sk-line w95"></div>
                <div class="skeleton sk-line w60"></div>
              </div>

              <div class="trend card-lite" aria-label="24 小时曲线">
                <div class="trend-head">
                  <div class="trend-title">24 小时曲线</div>
                  <div class="trend-note" id="ui-trend-note">—</div>
                </div>
                <canvas id="trend-canvas" aria-label="24小时温度曲线"></canvas>
              </div>

              <div class="outfit card-lite" aria-label="穿搭建议">
                <div class="outfit-head">
                  <div class="outfit-title">穿搭建议</div>
                  <div class="outfit-lv" id="ui-level">Lv —</div>
                </div>
                <div class="outfit-items" id="ui-outfit-items">—</div>
              </div>

              <div class="quick-feedback" aria-label="快捷反馈">
                <button class="qbtn cold" id="btn-cold" type="button">有点冷</button>
                <button class="qbtn ok" id="btn-ok" type="button">刚刚好</button>
                <button class="qbtn hot" id="btn-hot" type="button">有点热</button>
              </div>
            </div>
          </section>
        </div>
      </section>

      <section class="tab" id="tab-wardrobe" aria-label="数字衣橱">
        <div class="stack">
          <section class="card" aria-label="数字衣橱">
            <div class="h2">数字衣橱</div>
            <div class="p">这里将展示你收纳的单品，并用于更贴合的推荐。</div>
            <div class="stat-row">
              <div class="stat">
                <div class="k">已收纳</div>
                <div class="v" id="ui-wardrobe-count">42</div>
              </div>
              <div class="stat">
                <div class="k">偏好偏移</div>
                <div class="v" id="ui-offset-badge">0</div>
              </div>
            </div>
          </section>
        </div>
      </section>

      <section class="tab" id="tab-calibration" aria-label="私人偏好校准">
        <div class="stack">
          <section class="card" aria-label="私人偏好校准">
            <div class="h2">私人偏好校准</div>
            <div class="p">拖动滑块会立刻影响体感温度与穿搭等级。</div>

            <div class="slider-block">
              <div class="slider-head">
                <div class="k">偏好刻度</div>
                <div class="v">
                  <span id="ui-offset-label">体感正常</span>
                  <span style="margin-left: 10px" id="ui-offset">0</span>
                </div>
              </div>
              <input
                id="offset-slider"
                class="slider"
                type="range"
                min="-3"
                max="3"
                step="1"
                value="0"
                aria-label="偏好滑块"
              />
              <div class="slider-ends" aria-hidden="true">
                <span>怕冷</span>
                <span>怕热</span>
              </div>
            </div>
          </section>

          <section class="card" aria-label="统计">
            <div class="h2">统计</div>
            <div class="p">数字衣橱已收纳：<strong>42</strong> 件单品</div>
            <div class="stat-row">
              <div class="stat">
                <div class="k">反馈次数</div>
                <div class="v" id="ui-feedback-count">0</div>
              </div>
              <div class="stat">
                <div class="k">当前偏移</div>
                <div class="v" id="ui-offset-badge-2">0</div>
              </div>
            </div>
          </section>
        </div>
      </section>
    </main>

    <nav class="tabbar" aria-label="底部导航">
      <button class="tabbtn active" data-tab="home" type="button" aria-label="首页">
        <svg class="tabico" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1v-10.5Z"></path>
        </svg>
      </button>
      <button class="tabbtn" data-tab="wardrobe" type="button" aria-label="数字衣橱">
        <svg class="tabico" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 5c2.2 2 5 3 8 3s5.8-1 8-3"></path>
          <path d="M6 5v3.5c0 1.2.8 2.4 2 3l2.5 1.5"></path>
          <path d="M18 5v3.5c0 1.2-.8 2.4-2 3L13.5 13"></path>
          <path d="M7 22V12.5"></path>
          <path d="M17 22V12.5"></path>
        </svg>
      </button>
      <button class="tabbtn" data-tab="calibration" type="button" aria-label="私人偏好校准">
        <svg class="tabico" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"></path>
          <path
            d="M19.4 15a7.8 7.8 0 0 0 .1-1 7.8 7.8 0 0 0-.1-1l2-1.5-2-3.4-2.4 1a8 8 0 0 0-1.7-1l-.3-2.6H9l-.3 2.6a8 8 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.5a7.8 7.8 0 0 0-.1 1 7.8 7.8 0 0 0 .1 1l-2 1.5 2 3.4 2.4-1a8 8 0 0 0 1.7 1l.3 2.6h6l.3-2.6a8 8 0 0 0 1.7-1l2.4 1 2-3.4-2-1.5Z"
          ></path>
        </svg>
      </button>
    </nav>

    <script>
      (() => {
        "use strict";

        // ===== Config =====
        const QWEATHER_KEY = "63d45dfa246b4e38bcef997d971d5f4e";
        const QWEATHER_LOCATION = "101090501"; // Tangshan
        const QWEATHER_HOST = "https://q53yfrupmn.re.qweatherapi.com";

        const STORAGE_KEYS = {
          tempOffset: "tempOffset",
          feedbackCount: "feedbackCount",
          wardrobeCount: "wardrobeCount",
        };

        const OFFSET_MIN = -3;
        const OFFSET_MAX = 3;
        const FEEDBACK_STEP = 1; // quick feedback delta

        // ===== State =====
        const state = {
          loading: true,
          error: null,
          usedMock: false,
          now: null,
          hourly24: [],
          daily3: null,
          indices: [],
          tempOffset: 0,
          feedbackCount: 0,
          wardrobeCount: 42,
        };

        // ===== Utils =====
        const $ = (id) => document.getElementById(id);
        function clamp(n, min, max) {
          return Math.max(min, Math.min(max, n));
        }

        const OFFSET_LABELS = {
          "-3": "极度怕冷",
          "-2": "较怕冷",
          "-1": "偏怕冷",
          "0": "体感正常",
          "1": "偏怕热",
          "2": "较怕热",
          "3": "极度怕热",
        };

        function offsetToLabel(v) {
          const n = clamp(Math.round(Number(v) || 0), OFFSET_MIN, OFFSET_MAX);
          return OFFSET_LABELS[String(n)] || "体感正常";
        }

        function formatOffset(v) {
          const n = Number(v);
          if (!Number.isFinite(n) || n === 0) return "0";
          return n > 0 ? `+${n}` : String(n);
        }

        function readNum(key, fallback) {
          const v = Number(localStorage.getItem(key));
          return Number.isFinite(v) ? v : fallback;
        }

        function writeNum(key, value) {
          localStorage.setItem(key, String(value));
        }

        function api(path) {
          return `${QWEATHER_HOST}${path}?location=${QWEATHER_LOCATION}&key=${QWEATHER_KEY}&lang=zh`;
        }

        async function fetchJson(url) {
          const res = await fetch(url);
          const data = await res.json();
          if (!res.ok) throw new Error(`http ${res.status}`);
          return data;
        }

        // ===== Algorithm =====
        // calculatedTemp = realTemp + humidity*0.15 - windSpeed*0.2 + tempOffset
        // Here tempOffset is user calibration:
        // negative -> user feels colder -> recommend thicker (lower calculatedTemp band)
        // positive -> user feels warmer -> recommend thinner (higher band)
        function calculateTemp(now, tempOffset) {
          if (!now) return null;
          const realTemp = Number(now.temp);
          const humidity = Number(now.humidity);
          const windSpeed = Number(now.windSpeed);
          const offset = Number(tempOffset) || 0;
          if (![realTemp, humidity, windSpeed, offset].every((n) => Number.isFinite(n))) return null;
          return realTemp + humidity * 0.15 - windSpeed * 0.2 + offset;
        }

        // 10-level mapping from -20..35+ (no seasonal words)
        const OUTFIT_TABLE = {
          10: ["长款加厚羽绒服", "发热内衣", "羊绒衫", "围巾帽子", "保暖手套"],
          9: ["厚羽绒服", "高领毛衣", "保暖裤"],
          8: ["羽绒服/羊羔毛外套", "厚针织", "加厚袜"],
          7: ["厚呢外套/轻薄羽绒", "中厚毛衣"],
          6: ["外套", "衬衫/打底", "长裤"],
          5: ["风衣/西装外套", "薄针织/长袖"],
          4: ["卫衣/针织开衫", "T 恤"],
          3: ["长袖衬衫", "轻薄连衣裙/半裙"],
          2: ["短袖/吊带", "防晒衫"],
          1: ["极简清爽", "亚麻/真丝/速干面料"],
        };

        function getOutfitLevel(t) {
          const temp = Number(t);
          if (!Number.isFinite(temp)) return 5;
          // [-20..35+] bands
          if (temp <= -15) return 10;
          if (temp <= -5) return 9;
          if (temp <= 0) return 8;
          if (temp <= 6) return 7;
          if (temp <= 12) return 6;
          if (temp <= 18) return 5;
          if (temp <= 22) return 4;
          if (temp <= 26) return 3;
          if (temp <= 30) return 2;
          return 1;
        }

        function formatOutfit(level) {
          const items = OUTFIT_TABLE[level] || OUTFIT_TABLE[5];
          return items.join(" · ");
        }

        function pickEmotion(level) {
          const TEXT = {
            10: "今天真的很冷，你值得被好好包裹住。",
            9: "今天冷得有点锋利，保暖要更认真一点。",
            8: "今天空气偏冷，厚针织会让你更安心。",
            7: "今天风一吹就凉，外层选更防风的会舒服很多。",
            6: "今天体感偏凉，穿搭做一点层次会更精致。",
            5: "今天刚刚好，利落外套会很显气质。",
            4: "今天很舒服，轻松一点也很好看。",
            3: "今天微微偏热，轻薄长袖会更松弛。",
            2: "今天偏热，防晒和补水记得安排上。",
            1: "今天很热，选择透气面料会让你更自在。",
          };
          return TEXT[level] || "今天穿得舒服最重要。";
        }

        // ===== Insight =====
        // Soft, helpful, single-paragraph Chinese advice.
        function generateInsight(input) {
          const parts = [];

          const pop = Number(input.pop);
          const windScale = Number(input.windScale);
          const uvIndex = Number(input.uvIndex);
          const tMax = Number(input.tempMax);
          const tMin = Number(input.tempMin);

          if (Number.isFinite(input.level)) parts.push(pickEmotion(input.level));

          if (Number.isFinite(pop)) {
            if (pop >= 70) parts.push("降水概率偏高，带伞会更从容");
            else if (pop >= 40) parts.push("可能会有零星降水，备一把轻便伞更安心");
          }

          if (Number.isFinite(windScale)) {
            if (windScale >= 6) parts.push("风力偏强，体感会被吹冷，外层尽量选防风材质");
            else if (windScale >= 4) parts.push("有点风，脖颈和脚踝记得照顾一下");
          }

          if (Number.isFinite(tMax) && Number.isFinite(tMin)) {
            const diff = Math.abs(tMax - tMin);
            if (diff >= 12) parts.push(`温差约 ${Math.round(diff)}°，晚上出门建议多带一件`);
            else if (diff >= 8) parts.push(`温差约 ${Math.round(diff)}°，随手带件薄外搭更稳`);
          }

          if (Number.isFinite(uvIndex)) {
            if (uvIndex >= 8) parts.push("紫外线较强，记得防晒与遮阳");
            else if (uvIndex >= 6) parts.push("紫外线偏高，防晒可以补涂一次");
          }

          if (!parts.length) return "今天整体比较平稳，按体感温度挑一套舒服的层次就好。";
          return parts.join("；") + "。";
        }

        // ===== 24h Curve (Canvas) =====
        function drawTrendCanvas(temps) {
          const canvas = $("trend-canvas");
          if (!canvas) return;
          const ctx = canvas.getContext("2d");
          if (!ctx) return;

          const dpr = Math.max(1, Math.floor(window.devicePixelRatio || 1));
          const w = Math.max(280, canvas.clientWidth);
          const h = Math.max(120, canvas.clientHeight);
          canvas.width = w * dpr;
          canvas.height = h * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, w, h);

          const pointsRaw = temps
            .map((t) => Number(t))
            .filter((n) => Number.isFinite(n))
            .slice(0, 24);
          if (pointsRaw.length < 6) return;

          const min = Math.min(...pointsRaw);
          const max = Math.max(...pointsRaw);
          const span = Math.max(2, max - min);
          const padX = 14;
          const padY = 18;
          const innerW = w - padX * 2;
          const innerH = h - padY * 2;

          const pts = pointsRaw.map((v, i) => {
            const x = padX + (i / (pointsRaw.length - 1)) * innerW;
            const y = padY + (1 - (v - min) / span) * innerH;
            return { x, y, v };
          });

          let minIdx = 0;
          let maxIdx = 0;
          for (let i = 1; i < pts.length; i++) {
            if (pts[i].v < pts[minIdx].v) minIdx = i;
            if (pts[i].v > pts[maxIdx].v) maxIdx = i;
          }

          // light baseline grid
          ctx.strokeStyle = "rgba(90,90,90,0.08)";
          ctx.lineWidth = 1;
          for (let i = 1; i <= 2; i++) {
            const y = padY + (i / 3) * innerH;
            ctx.beginPath();
            ctx.moveTo(padX, y);
            ctx.lineTo(w - padX, y);
            ctx.stroke();
          }

          // Smooth line (midpoint quadratic)
          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y);
          for (let i = 1; i < pts.length - 1; i++) {
            const midX = (pts[i].x + pts[i + 1].x) / 2;
            const midY = (pts[i].y + pts[i + 1].y) / 2;
            ctx.quadraticCurveTo(pts[i].x, pts[i].y, midX, midY);
          }
          ctx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);

          // glow
          ctx.save();
          ctx.strokeStyle = "rgba(247,241,225,0.85)";
          ctx.lineWidth = 5;
          ctx.shadowColor = "rgba(255,159,137,0.18)";
          ctx.shadowBlur = 14;
          ctx.stroke();
          ctx.restore();

          ctx.strokeStyle = "rgba(247,241,225,0.95)";
          ctx.lineWidth = 3;
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.stroke();

          // min/max dots + labels
          const drawDot = (p) => {
            ctx.beginPath();
            ctx.fillStyle = "rgba(255,159,137,0.75)";
            ctx.arc(p.x, p.y, 3.6, 0, Math.PI * 2);
            ctx.fill();
          };
          drawDot(pts[minIdx]);
          drawDot(pts[maxIdx]);

          ctx.font = "800 12px Quicksand, system-ui";
          ctx.fillStyle = "rgba(90,90,90,0.82)";
          ctx.fillText(`${Math.round(pts[minIdx].v)}°`, pts[minIdx].x + 6, pts[minIdx].y + 16);
          ctx.fillText(`${Math.round(pts[maxIdx].v)}°`, pts[maxIdx].x + 6, Math.max(14, pts[maxIdx].y - 8));
        }

        // ===== Weather theming =====
        function iconToTheme(iconCode) {
          const code = Number(iconCode);
          if (!Number.isFinite(code)) return "sun";
          if (code >= 300 && code < 400) return "rain";
          if (code >= 400 && code < 500) return "snow";
          if (code >= 200 && code < 300) return "wind";
          if (code === 100) return "sun";
          if (code >= 101 && code <= 104) return "cloud";
          return "cloud";
        }

        function applyWeatherTheme(iconCode) {
          const theme = iconToTheme(iconCode);
          document.body.dataset.sky = theme;
        }

        // ===== Data extraction =====
        function getUvIndex() {
          const list = state.indices;
          if (!Array.isArray(list)) return null;
          const uv = list.find((x) => typeof x?.name === "string" && x.name.includes("紫外线"));
          if (!uv) return null;
          const level = Number(uv.level);
          if (Number.isFinite(level)) return level;
          const cat = String(uv.category || "");
          if (cat.includes("强")) return 8;
          if (cat.includes("中")) return 6;
          if (cat.includes("弱")) return 3;
          return null;
        }

        function calcPopMaxNext12h() {
          const hourly = state.hourly24 || [];
          const slice = hourly.slice(0, 12);
          const pops = slice.map((h) => Number(h.pop)).filter((n) => Number.isFinite(n));
          if (!pops.length) return null;
          return Math.max(...pops);
        }

        function getTodayMinMax() {
          const d = state.daily3?.[0];
          if (!d) return { min: null, max: null };
          const min = Number(d.tempMin);
          const max = Number(d.tempMax);
          return {
            min: Number.isFinite(min) ? min : null,
            max: Number.isFinite(max) ? max : null,
          };
        }

        // ===== UI =====
        function setText(id, text) {
          const el = $(id);
          if (!el) return;
          el.textContent = text;
        }

        function updateUI() {
          const now = state.now;
          const calculated = calculateTemp(now, state.tempOffset);
          const level = getOutfitLevel(calculated);

          setText("ui-temp-now", now ? `${Number(now.temp)}°` : "—");
          setText("ui-temp-perceived", calculated == null ? "—" : `${calculated.toFixed(1)}°C`);
          setText("ui-cond", now?.text ? (state.usedMock ? `${now.text}（示例）` : now.text) : "—");

          setText("ui-level", calculated == null ? "Lv —" : `Lv ${level}`);
          setText("ui-outfit-items", calculated == null ? "—" : formatOutfit(level));

          setText("ui-offset", formatOffset(state.tempOffset));
          setText("ui-offset-label", offsetToLabel(state.tempOffset));
          setText("ui-offset-badge", formatOffset(state.tempOffset));
          setText("ui-offset-badge-2", formatOffset(state.tempOffset));
          setText("ui-feedback-count", String(state.feedbackCount));
          setText("ui-wardrobe-count", String(state.wardrobeCount));

          // Keep slider synced even when quick feedback changes the offset.
          const slider = $("offset-slider");
          if (slider && slider.value !== String(state.tempOffset)) slider.value = String(state.tempOffset);

          // Trend note + Canvas
          const temps = state.hourly24.map((h) => Number(h.temp)).filter((n) => Number.isFinite(n));
          if (temps.length) {
            const min = Math.min(...temps);
            const max = Math.max(...temps);
            setText("ui-trend-note", `最低 ${Math.round(min)}° · 最高 ${Math.round(max)}°`);
          } else {
            setText("ui-trend-note", "—");
          }
          drawTrendCanvas(temps);

          // Insight text
          const uvIndex = getUvIndex();
          const pop = calcPopMaxNext12h();
          const mm = getTodayMinMax();
          const windScale = now?.windScale != null ? Number(now.windScale) : null;

          const insight = generateInsight({
            windScale,
            pop,
            uvIndex,
            tempMax: mm.max,
            tempMin: mm.min,
            level,
          });
          const insightEl = $("ui-insight");
          if (insightEl) {
            const prefix = state.error ? `${state.error}\n` : "";
            insightEl.textContent = `${prefix}${insight}`;
          }

          applyWeatherTheme(now?.icon);
        }

        function setLoading(isLoading) {
          state.loading = isLoading;
          const insightEl = $("ui-insight");
          if (!insightEl) return;
          if (isLoading) {
            insightEl.innerHTML =
              '<div class="skeleton sk-line w80"></div><div class="skeleton sk-line w95"></div><div class="skeleton sk-line w60"></div>';
          }
        }

        // ===== Tabs =====
        function setActiveTab(name) {
          ["home", "wardrobe", "calibration"].forEach((t) => {
            const el = document.getElementById(`tab-${t}`);
            if (el) el.classList.toggle("active", t === name);
          });
          document.querySelectorAll(".tabbtn").forEach((b) => {
            b.classList.toggle("active", b.dataset.tab === name);
          });
        }

        // ===== Feedback & Slider =====
        function persistOffset() {
          writeNum(STORAGE_KEYS.tempOffset, state.tempOffset);
        }

        function persistFeedbackCount() {
          writeNum(STORAGE_KEYS.feedbackCount, state.feedbackCount);
        }

        function applyOffsetDelta(delta) {
          state.tempOffset = clamp(state.tempOffset + delta, OFFSET_MIN, OFFSET_MAX);
          persistOffset();
          updateUI();
        }

        function recordFeedback(kind) {
          state.feedbackCount += 1;
          persistFeedbackCount();

          if (kind === "cold") applyOffsetDelta(-FEEDBACK_STEP);
          else if (kind === "hot") applyOffsetDelta(+FEEDBACK_STEP);
          else updateUI();
        }

        // ===== Weather fetch =====
        async function loadWeather() {
          const nowUrl = api("/v7/weather/now");
          const h24Url = api("/v7/weather/24h");
          const d3Url = api("/v7/weather/3d");
          const idxUrl = api("/v7/indices/1d") + "&type=0";

          try {
            state.error = null;
            state.usedMock = false;

            const [nowData, hourlyData, dailyData, idxData] = await Promise.all([
              fetchJson(nowUrl),
              fetchJson(h24Url),
              fetchJson(d3Url),
              fetchJson(idxUrl),
            ]);

            const ok = (d) => d?.code === "200";
            if (!ok(nowData) || !nowData?.now) throw new Error(`qweather now ${nowData?.code || "?"}`);
            if (!ok(hourlyData) || !Array.isArray(hourlyData?.hourly))
              throw new Error(`qweather 24h ${hourlyData?.code || "?"}`);
            if (!ok(dailyData) || !Array.isArray(dailyData?.daily))
              throw new Error(`qweather 3d ${dailyData?.code || "?"}`);
            if (!ok(idxData) || !Array.isArray(idxData?.daily))
              throw new Error(`qweather indices ${idxData?.code || "?"}`);

            state.now = nowData.now;
            state.hourly24 = hourlyData.hourly;
            state.daily3 = dailyData.daily;
            state.indices = idxData.daily;
          } catch (e) {
            console.warn("Weather fetch failed, using mock data", e);
            state.error = "暂时没连上天气服务，我先用示例数据陪你看看；稍后刷新就会恢复。";
            state.usedMock = true;
            state.now = {
              temp: 18,
              humidity: 65,
              windSpeed: 12,
              windScale: 3,
              icon: 100,
              text: "晴",
            };
            state.hourly24 = Array.from({ length: 24 }, (_, i) => ({
              temp: 16 + Math.sin(((i - 10) / 12) * Math.PI) * 3.6,
              pop: i >= 9 && i <= 16 ? 35 : 10,
            }));
            state.daily3 = [{ tempMax: 21, tempMin: 9 }];
            state.indices = [{ name: "紫外线指数", level: "6", category: "中等" }];
          }
        }

        // ===== Init =====
        function bindEvents() {
          document.querySelectorAll(".tabbtn").forEach((btn) => {
            btn.addEventListener("click", () => setActiveTab(btn.dataset.tab));
          });

          const cold = $("btn-cold");
          const ok = $("btn-ok");
          const hot = $("btn-hot");
          if (cold) cold.addEventListener("click", () => recordFeedback("cold"));
          if (ok) ok.addEventListener("click", () => recordFeedback("ok"));
          if (hot) hot.addEventListener("click", () => recordFeedback("hot"));

          const slider = $("offset-slider");
          if (slider) {
            slider.addEventListener("input", (e) => {
              const v = Number(e.target.value);
              state.tempOffset = clamp(Number.isFinite(v) ? v : 0, OFFSET_MIN, OFFSET_MAX);
              persistOffset();
              updateUI();
            });
          }
        }

        async function init() {
          state.tempOffset = clamp(readNum(STORAGE_KEYS.tempOffset, 0), OFFSET_MIN, OFFSET_MAX);
          state.feedbackCount = Math.max(0, Math.floor(readNum(STORAGE_KEYS.feedbackCount, 0)));
          state.wardrobeCount = Math.max(0, Math.floor(readNum(STORAGE_KEYS.wardrobeCount, 42)));

          const slider = $("offset-slider");
          if (slider) slider.value = String(state.tempOffset);

          bindEvents();
          setLoading(true);
          await loadWeather();
          setLoading(false);
          updateUI();
        }

        window.addEventListener("load", () => {
          init();
        });
      })();
    </script>
  </body>
</html>
